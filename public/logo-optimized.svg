<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- EventNexus Logo - Optimized SVG -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" opacity="0.1" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- Compass/Nexus Symbol -->
  <g transform="translate(100,100)">
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#4f46e5"/>
    
    <!-- North -->
    <line x1="0" y1="-50" x2="0" y2="-30" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
    
    <!-- East -->
    <line x1="50" y1="0" x2="30" y2="0" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    
    <!-- South -->
    <line x1="0" y1="50" x2="0" y2="30" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    
    <!-- West -->
    <line x1="-50" y1="0" x2="-30" y2="0" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Connecting circle -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
