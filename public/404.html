<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EventNexus - Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect for BrowserRouter with custom domain
    // Store the full path and redirect to root
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    
    // Store in sessionStorage so index.html can restore it
    sessionStorage.setItem('redirect', path + search + hash);
    
    // Redirect to root (custom domain, no /EventNexus/ prefix)
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
