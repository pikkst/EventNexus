<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EventNexus - Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect for BrowserRouter
    // Store the full path and redirect to root
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    
    // Remove /EventNexus/ prefix if present
    var redirectPath = path.replace('/EventNexus', '');
    
    // Store in sessionStorage so index.html can restore it
    sessionStorage.setItem('redirect', redirectPath + search + hash);
    
    // Redirect to root
    window.location.replace('/EventNexus/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
