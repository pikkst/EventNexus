name: Build Admin Support APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/EventNexusAdminSupport/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/android/EventNexusAdminSupport/gradlew

      - name: Build Debug APK
        run: |
          cd mobile/android/EventNexusAdminSupport
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: eventnexus-admin-support-debug
          path: mobile/android/EventNexusAdminSupport/app/build/outputs/apk/debug/app-debug.apk
