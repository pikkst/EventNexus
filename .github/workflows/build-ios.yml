name: Build iOS App

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Build iOS App
      working-directory: mobile/ios
      run: |
        xcodebuild -project EventNexusScanner.xcodeproj \
          -scheme EventNexusScanner \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath $PWD/build/EventNexusScanner.xcarchive \
          archive
    
    - name: Export IPA
      working-directory: mobile/ios
      run: |
        # Create export options plist
        cat > ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string></string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
        </dict>
        </plist>
        EOF
        
        # Export archive to IPA
        xcodebuild -exportArchive \
          -archivePath $PWD/build/EventNexusScanner.xcarchive \
          -exportPath $PWD/build \
          -exportOptionsPlist ExportOptions.plist || echo "Export failed - signing required"
    
    - name: Copy IPA to public downloads
      run: |
        mkdir -p public/downloads
        if [ -f mobile/ios/build/EventNexusScanner.ipa ]; then
          cp mobile/ios/build/EventNexusScanner.ipa public/downloads/EventNexusScanner.ipa
          echo "✅ IPA file created successfully"
        else
          echo "⚠️ IPA export failed - Apple signing certificates required"
          echo "📱 For iOS builds, you need:"
          echo "   1. Apple Developer Account"
          echo "   2. Code signing certificate"
          echo "   3. Provisioning profile"
          echo ""
          echo "Alternative: Build locally on macOS with Xcode"
          exit 1
        fi
    
    - name: Commit IPA to repository
      if: success()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add public/downloads/EventNexusScanner.ipa
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update iOS app build [skip ci]" && git push)
    
    - name: Upload IPA artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EventNexusScanner-iOS
        path: mobile/ios/build/EventNexusScanner.ipa
        if-no-files-found: warn
