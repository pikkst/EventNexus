name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x mobile/android/EventNexusScanner/gradlew
      
    - name: Build debug APK
      run: |
        cd mobile/android/EventNexusScanner
        ./gradlew assembleDebug --stacktrace
        
    - name: Get APK path
      id: apk-path
      run: echo "path=$(find mobile/android/EventNexusScanner/app/build/outputs/apk/debug -name '*.apk' | head -1)" >> $GITHUB_OUTPUT
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: EventNexusScanner-debug
        path: mobile/android/EventNexusScanner/app/build/outputs/apk/debug/*.apk
        
    - name: Copy APK to public downloads
      run: |
        mkdir -p public/downloads
        cp mobile/android/EventNexusScanner/app/build/outputs/apk/debug/app-debug.apk public/downloads/EventNexusScanner.apk
        
    - name: Commit APK to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add public/downloads/EventNexusScanner.apk
        git diff --staged --quiet || git commit -m "chore: Update Android APK build [skip ci]"
        git push
