name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x mobile/android/EventNexusScanner/gradlew
      
    - name: Build debug APK
      run: |
        cd mobile/android/EventNexusScanner
        ./gradlew assembleDebug --stacktrace
        
    - name: Get APK path
      id: apk-path
      run: echo "path=$(find mobile/android/EventNexusScanner/app/build/outputs/apk/debug -name '*.apk' | head -1)" >> $GITHUB_OUTPUT
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: EventNexusScanner-debug
        path: mobile/android/EventNexusScanner/app/build/outputs/apk/debug/*.apk
        
    - name: Copy APK to public downloads
      run: |
        mkdir -p public/downloads
        cp mobile/android/EventNexusScanner/app/build/outputs/apk/debug/app-debug.apk public/downloads/EventNexusScanner.apk
        ls -lh public/downloads/EventNexusScanner.apk
        
    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
    - name: Create Release with APK
      uses: softprops/action-gh-release@v1
      with:
        tag_name: scanner-v1.0.0-${{ steps.sha.outputs.short }}
        name: EventNexus Scanner APK (Build ${{ steps.sha.outputs.short }})
        body: |
          ## EventNexus Scanner - Latest Build
          
          **Download:** EventNexusScanner.apk (attached below)
          
          ### Installation
          1. Download the APK
          2. Enable "Install from Unknown Sources" on your Android device
          3. Install and launch the app
          4. Enter your scanner code from event organizer
          
          **Built:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          
          Direct download link will be available at: https://eventnexus.eu/downloads/EventNexusScanner.apk
        files: public/downloads/EventNexusScanner.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
