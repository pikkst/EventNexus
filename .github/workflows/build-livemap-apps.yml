  create-release:
    name: Create Release with APKs
    needs: [build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep "versionName" mobile/android/EventNexusLiveMap/app/build.gradle | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Download Android Debug APK
        uses: actions/download-artifact@v4
        with:
          name: eventnexus-livemap-debug
          path: ./apk-debug
      
      - name: Download Android Release APK
        uses: actions/download-artifact@v4
        with:
          name: eventnexus-livemap-release
          path: ./apk-release
      
      - name: Rename APK for release
        run: |
          mkdir -p release-files
          cp ./apk-release/app-release.apk ./release-files/EventNexusLiveMap.apk
          echo "✅ Renamed release APK to EventNexusLiveMap.apk"
          ls -lh ./release-files/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: livemap-v${{ steps.version.outputs.version }}-${{ github.sha }}
          name: EventNexus Live Map v${{ steps.version.outputs.version }}
          body: |
            ## EventNexus Live Map Mobile App
            
            ### Android APK
            - **EventNexusLiveMap.apk**: Production-ready release version
            
            ### Features
            - 🗺️ Interactive event map with location-based filtering
            - 📍 Proximity search with customizable radius
            - 🎫 In-app ticket viewing with QR codes
            - 🔐 Secure authentication with Supabase
            - 🌐 Deep linking to web platform for ticket purchase
            - 📱 Native performance
            
            ### Installation
            **Android**: Download and install EventNexusLiveMap.apk
            
            Built with ❤️ for EventNexus
          files: ./release-files/EventNexusLiveMap.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
