name: Build Live Map Mobile Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/EventNexusLiveMap/**'
      - 'mobile/ios/EventNexusLiveMap/**'
      - '.github/workflows/build-livemap-apps.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/android/EventNexusLiveMap/**'
      - 'mobile/ios/EventNexusLiveMap/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Live Map App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x mobile/android/EventNexusLiveMap/gradlew
      
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Build Debug APK
        run: |
          cd mobile/android/EventNexusLiveMap
          ./gradlew assembleDebug
      
      - name: Build Release APK
        run: |
          cd mobile/android/EventNexusLiveMap
          ./gradlew assembleRelease
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eventnexus-livemap-debug
          path: mobile/android/EventNexusLiveMap/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: eventnexus-livemap-release
          path: mobile/android/EventNexusLiveMap/app/build/outputs/apk/release/*.apk
          retention-days: 90

