name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Enforce legacy peer deps
        run: npm config set legacy-peer-deps true

      - name: Install dependencies (legacy peer deps)
        run: npm ci --legacy-peer-deps

      - name: Download Scanner APK to public folder
        continue-on-error: true
        run: |
          mkdir -p public/downloads
          # Download latest Scanner APK from releases
          SCANNER_URL=$(curl -s https://api.github.com/repos/pikkst/EventNexus/releases | \
            jq -r '.[] | select(.tag_name | contains("scanner")) | .assets[] | select(.name == "EventNexusScanner.apk") | .browser_download_url' | \
            head -1)
          if [ ! -z "$SCANNER_URL" ]; then
            echo "Downloading Scanner APK from: $SCANNER_URL"
            curl -L -o public/downloads/EventNexusScanner.apk "$SCANNER_URL"
            echo "✅ Scanner APK downloaded ($(du -h public/downloads/EventNexusScanner.apk | cut -f1))"
            ls -lh public/downloads/
          else
            echo "⚠️ No Scanner APK found in releases"
          fi

      - name: Download Live Map APK to public folder
        continue-on-error: true
        run: |
          mkdir -p public/downloads
          # Download latest Live Map APK from releases
          LIVEMAP_URL=$(curl -s https://api.github.com/repos/pikkst/EventNexus/releases | \
            jq -r '.[] | select(.tag_name | contains("livemap")) | .assets[] | select(.name == "EventNexusLiveMap.apk") | .browser_download_url' | \
            head -1)
          if [ ! -z "$LIVEMAP_URL" ]; then
            echo "Downloading Live Map APK from: $LIVEMAP_URL"
            curl -L -o public/downloads/EventNexusLiveMap.apk "$LIVEMAP_URL"
            echo "✅ Live Map APK downloaded ($(du -h public/downloads/EventNexusLiveMap.apk | cut -f1))"
            ls -lh public/downloads/
          else
            echo "⚠️ No Live Map APK found in releases"
          fi

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Verify APKs in dist
        run: |
          echo "Contents of dist/downloads:"
          ls -lh dist/downloads/ || echo "No downloads directory in dist"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
